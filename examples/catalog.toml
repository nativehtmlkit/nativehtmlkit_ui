# NativeHTMLKit UI example catalogue (machine-readable; the parity key is `id`).
#
# Every example exists in Python and PowerShell with the same window title, features and UI text.
# Paths are relative to examples/. qualification/examples/run_examples.py runs every entry and
# every tutorial step in both languages against the real host and fails when an entry, a file,
# a scenario or an uncatalogued example script is missing.

[[example]]
id = "hello"
title = "Hello UI"
summary = "The first window: a greeting that follows a text field, and a Reset button."
teaches = ["state and computed values", "two-way input", "button handler", "application lifecycle"]
python = "python/hello.py"
powershell = "powershell/hello.ps1"
run_python = "python hello.py"
run_powershell = "pwsh -File ./hello.ps1"
guide = "reactive-state"
language_specific = false

