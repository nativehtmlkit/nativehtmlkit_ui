[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nativehtmlkit_ui"
version = "0.1.0"
description = "Minimal reactive UI toolkit for native HTML/CSS desktop applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NativeHTMLKit contributors"}]
dependencies = ["nativehtmlkit>=0.1.0,<0.2.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: User Interfaces",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nativehtmlkit_ui.assets" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 112
